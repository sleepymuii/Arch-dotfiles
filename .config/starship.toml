format = '''
$os$directory $git_branch $character
'''

palette = 'colors'

[palettes.colors]
color1 = '#9dcbfb'
color2 = '#003355'
color3 = '#c2c7cf'
color4 = '#1d2024'
color5 = '#003355'
color6 = '#101418'
color7 = '#101418'
color8 = '#9dcbfb'
color9 = '#d4bee6'

# Prompt symbols 
[character]
success_symbol = "[>](color9 bold)"
error_symbol = "[>](@{error})"
vicmd_symbol = "[>](#f9e2af)"

[os]
disabled = false
format = "[󰣇 ](fg:color1) "

[directory]
format = "[$path](fg:color1)"

[git_branch]
format = "[ ](fg:color1)[$branch](fg:color3)"
