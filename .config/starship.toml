format = '''
$os$directory $git_branch $character
'''

palette = 'colors'

[palettes.colors]
color1 = '#adc6ff'
color2 = '#102f60'
color3 = '#c4c6d0'
color4 = '#1e1f25'
color5 = '#102f60'
color6 = '#111318'
color7 = '#111318'
color8 = '#adc6ff'
color9 = '#debcdf'

# Prompt symbols 
[character]
success_symbol = "[>](color9 bold)"
error_symbol = "[>](@{error})"
vicmd_symbol = "[>](#f9e2af)"

[os]
disabled = false
format = "[󰣇 ](fg:color1) "

[directory]
format = "[$path](fg:color1)"

[git_branch]
format = "[ ](fg:color1)[$branch](fg:color3)"
