### Hypridle ###

# note 
# Timeouts are tuned for an OLED display (aggressive DPMS to prevent burn-in).
# Adjust the timout values below to match your preferences and hardware

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid multiple hyprlock instances from starting.
    before_sleep_cmd = loginctl lock-session    # Locks the session just before the system goes to sleep.
    after_sleep_cmd = niri msg action power-on-monitors  # Ensures display turns on after sleep without requiring extra input.
}

# Listener to lock the screen after 3 minutes of inactivity
listener {
    timeout = 180                                # 3 minutes
    on-timeout = hyprlock                        # Lock screen with hyprlock
}

# Listener to turn off the display after 4 minutes of inactivity
listener {
    timeout = 240                                # 4 minutes
    on-timeout = niri msg action power-off-monitors       # Turn off display
    on-resume = niri msg action power-on-monitors         # Turn display back on upon activity
}

# Listener to suspend the system after 15 minutes of inactivity
listener {
    timeout = 900                                # 15 minutes
    on-timeout = systemctl suspend               # Suspend the PC
}
