# : Manager [[[

[mgr]
cwd = { fg = "#e6e1e9" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#ff7398", bg = "#ff7398" }
marker_cut      = { fg = "#ffd9e3", bg = "#ffd9e3" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#efb8c9", bg = "#efb8c9" }

# Count
count_copied   = { fg = "#31101d", bg = "#ffd9e3" }
count_cut      = { fg = "#31101d", bg = "#ffd9e3" }
count_selected = { fg = "#35275d", bg = "#efb8c9" }

# Border
border_symbol = "│"
border_style  = { fg = "#cebdfe" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#cebdfe", bold = true, bg = "#141218" }
inactive  = { fg = "#cbc3dc", bg = "#141218" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#cebdfe", fg = "#35275d", bold = true }
normal_alt  = { bg = "#48454e", fg = "#cac4cf" }

# Select mode
select_main = { bg = "#cbc3dc", fg = "#332d41", bold = true }
select_alt  = { bg = "#48454e", fg = "#cac4cf" }

# Unset mode
unset_main = { bg = "#efb8c9", fg = "#492532", bold = true }
unset_alt  = { bg = "#48454e", fg = "#cac4cf" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#7762a4" }
perm_write = { fg = "#d33b6a" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#ff4072" }
perm_sep   = { fg = "#8144ff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#cebdfe", bg = "#3b383e" }
progress_error  = { fg = "#ffb4ab", bg = "#3b383e" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#3b383e" }
cand = { fg = "#cebdfe" }
rest = { fg = "#35275d" }
desc = { fg = "#e6e1e9" }
separator = " ▶ "
separator_style = { fg = "#e6e1e9" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#efb8c9" }
title_warn  = { fg = "#cebdfe" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#cebdfe" }
active = { fg = "#efb8c9", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#cebdfe" }
value  = { fg = "#e6e1e9" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#cebdfe", bg = "#35275d" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#cebdfe" }
title   = {}
hovered = { fg = "#ffd9e3", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e6e1e9" }
run    = { fg = "#e6e1e9" }
footer = { fg = "#332d41", bg = "#cbc3dc" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files

    # Fallback
    { url = "*", fg = "#e6e1e9" },
    { url = "*/", fg = "#cebdfe" },
]

# : ]]]
